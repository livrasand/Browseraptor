name: Build Binaries

on:
  workflow_call:
    inputs:
      checkout-latest:
        description: "Si true, fuerza el checkout de la rama indicada en `branch`"
        type: boolean
        default: false
      branch:
        description: "Rama o ref a chequear cuando `checkout-latest` es true"
        type: string
        default: "master"
      publish-release:
        description: "Si true, crea un Release en GitHub con los artefactos y sus checksums SHA256"
        type: boolean
        default: false
      tag:
        description: "Tag del release (ej: v0.2.0). Solo se usa si publish-release es true. Si se omite, se toma de Cargo.toml"
        type: string
        default: ""
    secrets:
      # Secrets opcionales — configúralos en el workflow que invoque si vas a firmar/notarizar
      MAC_CERTIFICATE_BASE64:
        required: false
      MAC_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      TEST_VERSION:
        required: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-latest && inputs.branch || '' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-composite0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxfixes-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libharfbuzz-dev \
            libclang-dev \
            pkg-config

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          cargo build --release --locked
          mkdir -p out
          cp target/release/browseraptor out/browseraptor
          tar -czf out/Browseraptor-linux.tar.gz -C target/release browseraptor

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item target/release/browseraptor.exe out/browseraptor.exe -Force
          Compress-Archive -Path target/release/browseraptor.exe -DestinationPath out/Browseraptor-windows.zip -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          chmod +x ./bundle_macos.sh
          ./bundle_macos.sh
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/Browseraptor.app out/Browseraptor-macos.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browseraptor-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: ${{ inputs.publish-release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-latest && inputs.branch || '' }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets and checksums
        run: |
          set -eux
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="v$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p release
          find artifacts -maxdepth 2 -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "browseraptor" -o -name "browseraptor.exe" \) \
            -exec cp {} release/ \;
          test -n "$(find release -type f -print -quit)"
          cd release
          echo "=== SHA256 checksums ==="
          sha256sum * | tee SHA256SUMS.txt

      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          sed "s/1.0.0/${VERSION#v}/" RELEASE.md > /tmp/release-body.md
          gh release create "$VERSION" \
            --title "Browseraptor $VERSION" \
            --notes-file /tmp/release-body.md \
            --repo "$GITHUB_REPOSITORY" \
            release/*
