name: Build Binaries

on:
  workflow_call:
    inputs:
      checkout-latest:
        description: "Si true, fuerza el checkout de la rama indicada en `branch`"
        type: boolean
        default: false
      branch:
        description: "Rama o ref a chequear cuando `checkout-latest` es true"
        type: string
        default: "master"
      publish-release:
        description: "Si true, crea un Release en GitHub con los artefactos y sus checksums SHA256"
        type: boolean
        default: false
      tag:
        description: "Tag del release (ej: v0.3.0). Solo se usa si publish-release es true. Si se omite, se toma de Cargo.toml"
        type: string
        default: ""
      prerelease:
        description: "Si true, marca el release como pre-release"
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-latest && inputs.branch || '' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-composite0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxfixes-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libharfbuzz-dev \
            libclang-dev \
            pkg-config

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          cargo build --release --locked
          mkdir -p out
          tar -czf out/Browseraptor-linux-x64.tar.gz -C target/release browseraptor

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Compress-Archive -Path target/release/browseraptor.exe -DestinationPath out/Browseraptor-windows-x64.zip -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          chmod +x ./bundle_macos.sh
          ./bundle_macos.sh
          mkdir -p out
          ditto -c -k --keepParent dist/Browseraptor.app out/Browseraptor-macos-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browseraptor-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: ${{ inputs.publish-release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-latest && inputs.branch || '' }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets and checksums
        run: |
          set -eux
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="v$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)"
          fi
          V="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"

          mkdir -p release
          cp artifacts/Browseraptor-linux-x64.tar.gz "release/Browseraptor-${V}-linux-x64.tar.gz"
          cp artifacts/Browseraptor-windows-x64.zip "release/Browseraptor-${V}-windows-x64.zip"
          cp artifacts/Browseraptor-macos-arm64.zip "release/Browseraptor-${V}-macos-arm64.zip"
          cd release
          echo "=== SHA256 checksums ==="
          sha256sum * | tee SHA256SUMS.txt

      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          {
            echo "<a href=\"${BASE_URL}/Browseraptor-${V}-windows-x64.zip\"><img src=\"./assets/os/windows.png\"> Windows (x64)</a>"
            echo "<br>"
            echo "<a href=\"${BASE_URL}/Browseraptor-${V}-linux-x64.tar.gz\"><img src=\"./assets/os/linux.png\"> Linux (x64)</a>"
            echo "<br>"
            echo "<a href=\"${BASE_URL}/Browseraptor-${V}-macos-arm64.zip\"><picture><source srcset=\"./assets/os/apple.png\" media=\"(prefers-color-scheme: dark)\" /><img src=\"./assets/os/apple.svg\" width=\"14\" /></picture> macOS (Apple Silicon)</a>"
            echo
            sed "s/1.0.0/${V}/" RELEASE.md
          } > /tmp/release-body.md
          gh release create "$VERSION" \
            --title "Browseraptor $VERSION" \
            --notes-file /tmp/release-body.md \
            --repo "$GITHUB_REPOSITORY" \
            $PRERELEASE_FLAG \
            release/*
